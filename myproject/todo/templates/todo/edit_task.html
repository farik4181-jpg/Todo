<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати завдання</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Редагувати завдання</h2>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-4">
                                <!-- У value підставляємо старий текст завдання -->
                                <input type="text" name="title" class="form-control form-control-lg" value="{{ task.title }}" required>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'task_list' %}" class="btn btn-secondary">Скасувати</a>
                                <button type="submit" class="btn btn-primary">Зберегти зміни</button>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
